services:
  wishlist-api:
    build:
      context: ../../Wishlist_with_fastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8000/docs"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.wishlist.rule=Host(`wishlist.rodrigoolima.com.br`)"
      - "traefik.http.routers.wishlist.entrypoints=web"
      - "traefik.http.services.wishlist.loadbalancer.server.port=8000"
 
  migrations:
    build:
      context: ../../Wishlist_with_fastAPI
      dockerfile: Dockerfile
    env_file:
      - .env
    command: poetry run alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
 
  db:
    image: postgres:17.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
 
networks:
  internal:
  proxy:
    external: true
 
volumes:
  data:
