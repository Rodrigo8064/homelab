services:
  backoffice-api:
    build:
      context: ../../backoffice-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - static_files:/home/backoffice/staticfiles
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null",
             "-H", "Host: backoffice.rodrigoolima.com.br",
             "http://127.0.0.1:8000/api/healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.backoffice.rule=Host(`backoffice.rodrigoolima.com.br`)"
      - "traefik.http.routers.backoffice.entrypoints=web"
      - "traefik.http.services.backoffice.loadbalancer.server.port=8000"
 
  fix-permissions:
    image: alpine
    command: chown -R 1000:1000 /staticfiles
    restart: "no"
    network_mode: none
    volumes:
      - static_files:/staticfiles
 
  migrations:
    build:
      context: ../../backoffice-api
      dockerfile: Dockerfile
    env_file:
      - .env
    command: sh -c "poetry run python manage.py migrate --noinput && poetry run python manage.py collectstatic --noinput --clear"
    restart: "no"
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - static_files:/home/backoffice/staticfiles
    networks:
      - internal
 
  db:
    image: postgres:17.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
 
networks:
  internal:
  proxy:
    external: true
 
volumes:
  data:
  static_files:
